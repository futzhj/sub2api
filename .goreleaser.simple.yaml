# Simple GoReleaser: linux/amd64 binary + GitHub Release only (no GHCR/Docker)
version: 2

project_name: sub2api

before:
  hooks:
    - go mod tidy -C backend

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
    ldflags:
      - -s -w
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

# No Docker / GHCR in simple release
dockers: []
docker_manifests: []

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: false
  prerelease: auto
  name_template: "Sub2API {{.Version}}"
  skip_upload: false
  header: |
    > AI API Gateway Platform
    > Simple Release: linux/amd64 binary only (no GHCR image)

    {{ .Env.TAG_MESSAGE }}

  footer: |
    ---

    ## Installation (binary)

    ```bash
    # download sub2api_*_linux_amd64.tar.gz from this release, then:
    tar -xzf sub2api_*_linux_amd64.tar.gz
    sudo systemctl stop sub2api
    sudo cp sub2api /opt/sub2api/sub2api
    sudo systemctl start sub2api
    ```

    ## Documentation

    - [GitHub Repository](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }})
